; Sissy firmware — ESP32 WROOM-32 USB-C
; WiFi + WebSocket pull + OTA. No serial fallback.

[platformio]
default_envs = esp32dev
src_dir = firmware/src
include_dir = firmware/include

[env:esp32dev]
; Platform + library deps pinned to exact versions for reproducible builds.
; Drop the `@x.y.z` (no `^`) so PIO resolves a single version every time.
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-10
monitor_port = /dev/cu.usbserial-10
upload_protocol = esptool

lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.12.0
    adafruit/Adafruit BusIO@1.17.0
    tzapu/WiFiManager@2.0.17
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.0

build_flags =
    -D OLED_SDA=21
    -D OLED_SCL=22
    -D SISSY_FW_VERSION=\"0.1.0\"
    -D CORE_DEBUG_LEVEL=2
