name: pricing-oracle

# Asserts that the engine's token accounting and cost agree with `ccusage`, the
# tool users cross-check Sissy against.
#
# This replaced a script that policed hand-maintained rate tables. There are no
# tables any more — rates come from LiteLLM at runtime (`PriceCatalog`), which is
# the same source ccusage prices from, so the useful question is no longer "did a
# table drift" but "do the two tools still agree". A failure here means a
# *convention* diverged: which tokens count, how the 5m/1h cache-write tiers are
# split, whether Codex reasoning tokens are double-counted, and which of the
# `token_count` events Codex writes are turns at all.
#
# Runs on a fixed synthetic fixture rather than real logs, so the comparison is
# exact and reproducible. The fixture has to carry every shape whose handling
# could diverge, which a single line per request id does not: a turn written
# once billed the same either way while Sissy was billing a streamed turn at
# the count its first copy carried. See AGENTS.md.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "app/SissyCore/**"
      - "app/project.yml"
      - ".github/workflows/pricing-oracle.yml"

permissions:
  contents: read

jobs:
  oracle:
    name: sissy-cli vs ccusage
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Build the CLI
        working-directory: app
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Build the fixture
        run: |
          FIX="$RUNNER_TEMP/oracle"
          mkdir -p "$FIX/claude/projects/p" "$FIX/codex/sessions/2026/07/28"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          # The Codex shapes below need an order to be coherent: a fork cannot
          # copy a turn its parent had not taken yet.
          T0=$(date -u -v-30S +"%Y-%m-%dT%H:%M:%S.000Z")
          T1=$(date -u -v-20S +"%Y-%m-%dT%H:%M:%S.000Z")
          T2=$(date -u -v-10S +"%Y-%m-%dT%H:%M:%S.000Z")
          PARENT=019fa307-abce-79c3-9e7f-5305174c5f8d
          FORK=019fa314-9108-7501-8e0c-5adde66a9710
          # Exercises the conventions that actually diverge: the 5m/1h
          # cache-creation split, cache reads as their own billable channel,
          # Codex `reasoning_output_tokens` being a sub-breakdown of gross output
          # rather than an additive counter, and an assistant turn written four
          # times as it streams — same ids, growing output, repeated input and
          # cache — which is what the whole turn costs once, not four times the
          # cache read and none of the answer.
          cat > "$FIX/claude/projects/p/s.jsonl" <<JSONL
          {"type":"assistant","timestamp":"$NOW","requestId":"r1","message":{"id":"m1","model":"claude-opus-5","usage":{"input_tokens":1000,"output_tokens":2000,"cache_read_input_tokens":50000,"cache_creation_input_tokens":9000,"cache_creation":{"ephemeral_5m_input_tokens":4000,"ephemeral_1h_input_tokens":5000}}}}
          {"type":"assistant","timestamp":"$NOW","requestId":"r2","message":{"id":"m2","model":"claude-sonnet-5","usage":{"input_tokens":500,"output_tokens":700,"cache_read_input_tokens":10000,"cache_creation_input_tokens":0}}}
          {"type":"assistant","timestamp":"$NOW","requestId":"r3","message":{"id":"m3","model":"claude-haiku-4-5-20251001","usage":{"input_tokens":300,"output_tokens":100,"cache_read_input_tokens":2000,"cache_creation_input_tokens":1000,"cache_creation":{"ephemeral_5m_input_tokens":1000,"ephemeral_1h_input_tokens":0}}}}
          {"type":"assistant","timestamp":"$NOW","requestId":"r4","message":{"id":"m4","model":"claude-opus-5","usage":{"input_tokens":200,"output_tokens":3,"cache_read_input_tokens":30000,"cache_creation_input_tokens":0}}}
          {"type":"assistant","timestamp":"$NOW","requestId":"r4","message":{"id":"m4","model":"claude-opus-5","usage":{"input_tokens":200,"output_tokens":3,"cache_read_input_tokens":30000,"cache_creation_input_tokens":0}}}
          {"type":"assistant","timestamp":"$NOW","requestId":"r4","message":{"id":"m4","model":"claude-opus-5","usage":{"input_tokens":200,"output_tokens":3,"cache_read_input_tokens":30000,"cache_creation_input_tokens":0}}}
          {"type":"assistant","timestamp":"$NOW","requestId":"r4","message":{"id":"m4","model":"claude-opus-5","usage":{"input_tokens":200,"output_tokens":901,"cache_read_input_tokens":30000,"cache_creation_input_tokens":0}}}
          JSONL
          # Codex writes more `token_count` events than there are turns, and the
          # single-event fixture this replaced billed the same either way —
          # which is how a 1.8%-a-year over-count shipped past this job. Two
          # shapes carry it now. The parent ends on a re-emitted turn: the same
          # `last_token_usage` again with `total_token_usage` standing still,
          # which is what Codex leaves when a session ends or is interrupted.
          # The fork then copies the parent's whole history into its own log at
          # creation — stamped at its own start, where a turn it ran takes
          # seconds to come back — before taking one turn of its own. Only that
          # last one is the fork's to pay for.
          cat > "$FIX/codex/sessions/2026/07/28/rollout-2026-07-28T10-00-00-$PARENT.jsonl" <<JSONL
          {"type":"session_meta","timestamp":"$T0","payload":{"id":"$PARENT","source":"cli","model_provider":"openai"}}
          {"type":"turn_context","timestamp":"$T0","payload":{"turn_id":"t1","model":"gpt-5.6-sol"}}
          {"type":"event_msg","timestamp":"$T0","payload":{"type":"token_count","info":{"last_token_usage":{"input_tokens":14297,"cached_input_tokens":9600,"output_tokens":361,"reasoning_output_tokens":40,"total_tokens":14658},"total_token_usage":{"input_tokens":14297,"cached_input_tokens":9600,"output_tokens":361,"reasoning_output_tokens":40,"total_tokens":14658}}}}
          {"type":"event_msg","timestamp":"$T1","payload":{"type":"token_count","info":{"last_token_usage":{"input_tokens":2100,"cached_input_tokens":1800,"output_tokens":52,"reasoning_output_tokens":8,"total_tokens":2152},"total_token_usage":{"input_tokens":16397,"cached_input_tokens":11400,"output_tokens":413,"reasoning_output_tokens":48,"total_tokens":16810}}}}
          {"type":"event_msg","timestamp":"$T1","payload":{"type":"token_count","info":{"last_token_usage":{"input_tokens":2100,"cached_input_tokens":1800,"output_tokens":52,"reasoning_output_tokens":8,"total_tokens":2152},"total_token_usage":{"input_tokens":16397,"cached_input_tokens":11400,"output_tokens":413,"reasoning_output_tokens":48,"total_tokens":16810}}}}
          JSONL
          cat > "$FIX/codex/sessions/2026/07/28/rollout-2026-07-28T10-05-00-$FORK.jsonl" <<JSONL
          {"type":"session_meta","timestamp":"$T2","payload":{"id":"$FORK","forked_from_id":"$PARENT","source":"cli","model_provider":"openai"}}
          {"type":"turn_context","timestamp":"$T2","payload":{"turn_id":"t1","model":"gpt-5.6-sol"}}
          {"type":"event_msg","timestamp":"$T2","payload":{"type":"token_count","info":{"last_token_usage":{"input_tokens":14297,"cached_input_tokens":9600,"output_tokens":361,"reasoning_output_tokens":40,"total_tokens":14658},"total_token_usage":{"input_tokens":14297,"cached_input_tokens":9600,"output_tokens":361,"reasoning_output_tokens":40,"total_tokens":14658}}}}
          {"type":"event_msg","timestamp":"$T2","payload":{"type":"token_count","info":{"last_token_usage":{"input_tokens":2100,"cached_input_tokens":1800,"output_tokens":52,"reasoning_output_tokens":8,"total_tokens":2152},"total_token_usage":{"input_tokens":16397,"cached_input_tokens":11400,"output_tokens":413,"reasoning_output_tokens":48,"total_tokens":16810}}}}
          {"type":"event_msg","timestamp":"$NOW","payload":{"type":"token_count","info":{"last_token_usage":{"input_tokens":900,"cached_input_tokens":400,"output_tokens":30,"reasoning_output_tokens":5,"total_tokens":930},"total_token_usage":{"input_tokens":17297,"cached_input_tokens":11800,"output_tokens":443,"reasoning_output_tokens":53,"total_tokens":17740}}}}
          JSONL
          # A day the live tail's 48h window never reaches, for `--backfill`.
          # `--scan` cannot assert this one: it runs the tail's own window and
          # reports today, so every day the archive is filled in from would be
          # invisible to it. The file is stamped to its own day so the pass
          # exercises the rule that decides when a day is final — files come
          # newest first, and a day is written once no unread file can still
          # carry it.
          PAST_DAY=$(date -u -v-5d +"%Y-%m-%d")
          PAST=$(date -u -v-5d +"%Y-%m-%dT12:00:00.000Z")
          cat > "$FIX/claude/projects/p/past.jsonl" <<JSONL
          {"type":"assistant","timestamp":"$PAST","requestId":"p1","message":{"id":"pm1","model":"claude-opus-5","usage":{"input_tokens":700,"output_tokens":1500,"cache_read_input_tokens":40000,"cache_creation_input_tokens":6000,"cache_creation":{"ephemeral_5m_input_tokens":2000,"ephemeral_1h_input_tokens":4000}}}}
          {"type":"assistant","timestamp":"$PAST","requestId":"p2","message":{"id":"pm2","model":"claude-sonnet-5","usage":{"input_tokens":400,"output_tokens":600,"cache_read_input_tokens":8000,"cache_creation_input_tokens":0}}}
          JSONL
          touch -t "$(date -u -v-5d +"%Y%m%d1200")" "$FIX/claude/projects/p/past.jsonl"
          echo "PAST_DAY=$PAST_DAY" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/oracle.json" <<JSON
          {"claudeDataDir":"$FIX/claude/projects","codexDataDir":"$FIX/codex/sessions","pollIntervalSeconds":60,"providers":{"claudeCode":true,"codex":true}}
          JSON

      - name: Refresh the pricing catalog
        working-directory: app
        run: |
          # ccusage always prices from current LiteLLM. Writing the same
          # snapshot to Sissy's cache means a mismatch below is a convention
          # diverging rather than the embedded seed simply being older than
          # upstream.
          DD=$(xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Debug -showBuildSettings 2>/dev/null \
            | awk -F= '/BUILT_PRODUCTS_DIR/{print $2; exit}' | xargs)
          echo "DD=$DD" >> "$GITHUB_ENV"
          # `--refresh-catalog` carries its own retry budget (3 attempts x 20s
          # request timeout + ~7s of backoff) and exits non-zero if none of
          # them land a usable catalog, so a transient upstream slowdown the
          # fetch is designed to absorb does not turn into a red oracle.
          status=0
          "$DD/sissy-cli" --refresh-catalog > "$RUNNER_TEMP/refresh.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/refresh.log"
          exit "$status"

      - name: Compare against ccusage
        run: |
          FIX="$RUNNER_TEMP/oracle"
          CODEX_HOME="$FIX/codex" "$DD/sissy-cli" \
            --config "$RUNNER_TEMP/oracle.json" --scan > "$RUNNER_TEMP/sissy.json"
          CLAUDE_CONFIG_DIR="$FIX/claude" npx -y ccusage@latest claude --json \
            > "$RUNNER_TEMP/ccu-claude.json"
          CODEX_HOME="$FIX/codex" npx -y ccusage@latest codex --json \
            > "$RUNNER_TEMP/ccu-codex.json"
          python3 - <<'PY'
          import json, os, sys, datetime
          tmp = os.environ["RUNNER_TEMP"]
          sissy = json.load(open(f"{tmp}/sissy.json"))
          today = datetime.date.today().isoformat()

          def ccusage_row(path):
              data = json.load(open(path))
              for row in data.get("daily", []):
                  # `ccusage claude` keys the day as `period`, `ccusage codex` as `date`.
                  if row.get("period") == today or row.get("date") == today:
                      return row
              return None

          failures = []
          for provider, path in (
              ("claude-code", f"{tmp}/ccu-claude.json"),
              ("codex", f"{tmp}/ccu-codex.json"),
          ):
              row = ccusage_row(path)
              if row is None:
                  failures.append(f"{provider}: ccusage reported no row for {today}")
                  continue
              if provider not in sissy:
                  failures.append(f"{provider}: sissy --scan reported no totals")
                  continue
              mine_tokens = sissy[provider]["tokens"]
              mine_cost = float(sissy[provider]["cost"])
              their_tokens = row["totalTokens"]
              their_cost = row.get("totalCost", row.get("costUSD"))
              print(
                  f"{provider}: tokens {mine_tokens} vs {their_tokens} | "
                  f"cost {mine_cost:.6f} vs {their_cost:.6f}"
              )
              if mine_tokens != their_tokens:
                  failures.append(
                      f"{provider}: token mismatch {mine_tokens} vs {their_tokens}"
                  )
              # Both sides round to 6 decimals; anything above that is a real
              # convention divergence, not float noise.
              if abs(mine_cost - their_cost) > 1e-6:
                  failures.append(
                      f"{provider}: cost mismatch {mine_cost:.6f} vs {their_cost:.6f}"
                  )

          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print("sissy-cli and ccusage agree exactly")
          PY

      - name: Compare a backfilled day against ccusage
        run: |
          # The archive starts the day Sissy first runs; the CLIs' logs go back
          # months, and `--backfill` is what indexes the difference. A day it
          # writes is past and nothing will grow it back, so the agreement that
          # matters is the one asserted here rather than on today's totals.
          "$DD/sissy-cli" --config "$RUNNER_TEMP/oracle.json" --backfill \
            > "$RUNNER_TEMP/sissy-archive.json"
          python3 - <<'PY'
          import json, os, sys
          tmp = os.environ["RUNNER_TEMP"]
          day = os.environ["PAST_DAY"]
          archive = json.load(open(f"{tmp}/sissy-archive.json"))
          claude = json.load(open(f"{tmp}/ccu-claude.json"))

          mine = [d for d in archive if d["day"] == day and d["provider"] == "claude-code"]
          theirs = [
              r for r in claude.get("daily", [])
              if r.get("period") == day or r.get("date") == day
          ]
          failures = []
          if not mine:
              failures.append(f"the backfill archived no claude-code day for {day}")
          if not theirs:
              failures.append(f"ccusage reported no claude-code row for {day}")

          if not failures:
              rows = mine[0]["models"]
              got = {
                  "inputTokens": sum(r["inputTokens"] for r in rows),
                  "outputTokens": sum(r["outputTokens"] for r in rows),
                  "cacheReadTokens": sum(r["cacheReadTokens"] for r in rows),
                  "cacheCreationTokens": sum(r["cacheCreationTokens"] for r in rows),
              }
              want = {k: theirs[0][k] for k in got}
              cost = sum(float(r["cost"]) for r in rows)
              print(f"{day}: {got} vs {want} | cost {cost:.6f} vs {theirs[0]['totalCost']:.6f}")
              for key, value in got.items():
                  if value != want[key]:
                      failures.append(f"{day}: {key} {value} vs ccusage {want[key]}")
              # Sissy rounds per event and ccusage per day, so the two differ in
              # the last place they both carry and nowhere else.
              if abs(cost - theirs[0]["totalCost"]) > 1e-6:
                  failures.append(
                      f"{day}: cost {cost:.6f} vs ccusage {theirs[0]['totalCost']:.6f}"
                  )

          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"the backfilled {day} lands on ccusage exactly")
          PY
