name: release

# Triggers:
#   - push tag matching v* (e.g. v0.3.0)  → build + notarize + publish GitHub Release
#   - manual dispatch                     → same flow, lets you smoke-test without tagging
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERT_P12_BASE64   Developer ID Application cert + private key exported as .p12,
#                           then `base64 -i cert.p12 | pbcopy` → paste as secret.
#   APPLE_CERT_PASSWORD     Password used when exporting the .p12.
#   KEYCHAIN_PASSWORD       Any string — used to lock the throwaway runner keychain.
#   APPLE_ID                Apple ID email of the account that owns the RadonForge team.
#   APPLE_TEAM_ID           AS75YRKL95
#   APPLE_APP_PASSWORD      App-specific password from appleid.apple.com → Sign-In and
#                           Security → App-Specific Passwords. (Tied to APPLE_ID.)
#   SPARKLE_ED_PRIVATE_KEY  Sparkle's EdDSA private key, as `generate_keys -x` exports it.
#                           Signs the update feed and every DMG it names.
#   WEBSITE_REPO_TOKEN      Fine-grained token, Contents read/write on the website repo,
#                           which serves the update feed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v). Defaults to the latest git tag."
        required: false
        default: ""
      dry_run:
        description: "Skip notarization + release upload (cert import + build + sign only)."
        required: false
        default: "false"
      feed_url:
        description: "Update feed the build checks, for testing an update end to end. Empty keeps the production feed."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    # macos-26 matches the deployment target in app/project.yml and the
    # CI workflow's lane so the release binary is exercised on the same
    # OS/toolchain combo we test against.
    runs-on: macos-26
    env:
      SCHEME: Sissy
      SIGN_IDENTITY: "Developer ID Application"
      # Relative to app/, where every step that touches it runs.
      APP: build/export/Sissy.app
      SITE_REPO: xsmyile/sissy-website
      SITE_URL: https://sissy.smyile.com

    steps:
      - uses: actions/checkout@v6
        with:
          # scripts/version.sh derives the build number from the commit
          # count. The default shallow fetch would make it 1 on every run.
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          SISSY_VERSION: ${{ inputs.version }}
        run: |
          v="$(scripts/version.sh marketing)"
          b="$(scripts/version.sh build)"
          [[ -n "$v" && -n "$b" ]] || { echo "could not determine version" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=$b" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v (build $b)"

      - name: Read the release notes from the tag
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The release notes are the tag's own annotation. --generate-notes
          # lists every PR since the previous tag — ~140 of them for the
          # release after v0.1.8 — which says what changed in the repository
          # rather than what changed for a user. Read here rather than at
          # publication so a tag with nothing to say fails before the build
          # is signed and notarized, and before a bare tag is left published
          # with no release against it.
          # A lightweight tag has no annotation, and `%(contents)` then
          # resolves to the target commit's message — which would publish the
          # last commit subject as the release notes and pass every text check
          # below. The object type is the only thing that tells the two apart.
          if [[ "$(git cat-file -t "v$VERSION" 2>/dev/null)" != "tag" ]]; then
            echo "v$VERSION is a lightweight tag; the release notes are read from an annotation" >&2
            echo "rewrite it with: git tag -a -f v$VERSION && git push --tags --force" >&2
            exit 1
          fi
          notes="$(git tag -l --format='%(contents)' "v$VERSION")"
          if [[ -z "${notes//[[:space:]]/}" || "${notes//[[:space:]]/}" == "v$VERSION" ]]; then
            echo "tag v$VERSION carries no annotation beyond its own name; the release notes are read from it" >&2
            echo "rewrite it with: git tag -a -f v$VERSION && git push --tags --force" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install build tools
        run: brew install xcodegen create-dmg xcbeautify swiftlint

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint lint --quiet --lenient --baseline .swiftlint-baseline

      - name: Swift format lint
        run: |
          xcrun swift-format lint --recursive --strict \
            app/Sissy app/SissyCore app/SissyTests

      # Test gates duplicated from ci.yml so a release tag can never
      # ship behind a green CI run that didn't include the latest
      # commit. Cheap (<5 min) compared to the cost of shipping a DMG
      # that fails its own --self-test.
      - name: Build the CLI (Debug)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: CLI self-test
        working-directory: app
        run: |
          DD=$(xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Debug -showBuildSettings 2>/dev/null \
            | awk -F= '/BUILT_PRODUCTS_DIR/{print $2; exit}' | xargs)
          "$DD/sissy-cli" --self-test

      # The Release build of the app is the artifact itself, further down;
      # the CLI is built Release here so the configuration that ships runs
      # the self-test too, not only the Debug one.
      - name: Build the CLI (Release)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Release build CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: CLI self-test (Release)
        working-directory: app
        run: |
          DD=$(xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk -F= '/BUILT_PRODUCTS_DIR/{print $2; exit}' | xargs)
          "$DD/sissy-cli" --self-test

      - name: Codex parser smoke (--scan against fixture)
        working-directory: app
        timeout-minutes: 3
        run: |
          DD=$(xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Debug -showBuildSettings 2>/dev/null \
            | awk -F= '/BUILT_PRODUCTS_DIR/{print $2; exit}' | xargs)
          FIXTURE_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$FIXTURE_HOME/sessions/2026/05/25"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > "$FIXTURE_HOME/sessions/2026/05/25/rollout-fixture.jsonl" <<JSONL
          {"type":"session_meta","timestamp":"$NOW","payload":{"id":"fixture","timestamp":"$NOW","model_provider":"openai"}}
          {"type":"turn_context","timestamp":"$NOW","payload":{"turn_id":"t1","model":"gpt-5-codex"}}
          {"type":"event_msg","timestamp":"$NOW","payload":{"type":"token_count","info":{"last_token_usage":{"input_tokens":14297,"cached_input_tokens":9600,"output_tokens":361,"reasoning_output_tokens":0,"total_tokens":14658},"total_token_usage":{"input_tokens":14297,"cached_input_tokens":9600,"output_tokens":361,"reasoning_output_tokens":0,"total_tokens":14658}}}}
          {"type":"event_msg","timestamp":"$NOW","payload":{"type":"token_count","info":{"last_token_usage":{"input_tokens":28035,"cached_input_tokens":9600,"output_tokens":546,"reasoning_output_tokens":66,"total_tokens":28581},"total_token_usage":{"input_tokens":42332,"cached_input_tokens":19200,"output_tokens":907,"reasoning_output_tokens":66,"total_tokens":43239}}}}
          JSONL
          # `output` is already gross (includes reasoning); we never re-add it.
          # Sum: event1 (4697+361+9600) + event2 (18435+546+9600) = 43_239
          EXPECTED=43239
          OUT=$(CODEX_HOME="$FIXTURE_HOME" "$DD/sissy-cli" --scan --scan-provider codex)
          echo "$OUT"
          GOT=$(echo "$OUT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['codex']['tokens'])")
          [ "$GOT" = "$EXPECTED" ] || { echo "Codex parser drift: expected $EXPECTED, got $GOT" >&2; exit 1; }

      - name: Unit tests (Debug)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme Sissy \
            -configuration Debug -destination 'platform=macOS' \
            test CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # After the test gates, never before them. The import puts a throwaway
      # keychain first in the user search list, and the session-store tests
      # write to the real one: measured 2026-09-22 on the v0.2.0 tag, five of
      # them failed here and passed in ci.yml, which imports no certificate,
      # on that same commit. Nothing before Build Release needs the identity.
      - name: Import signing certificate
        env:
          CERT_P12_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/sissy-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$CERT_P12_B64" | base64 --decode --output "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Allow codesign to use the key non-interactively
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Put our keychain first in the search list (login keychain still present).
          # `mapfile` is bash 4+; macOS runners run steps under bash 3.2, so read
          # the existing list with a loop that works on both.
          existing_keychains=()
          while IFS= read -r kc; do existing_keychains+=("$kc"); done \
            < <(security list-keychain -d user | tr -d '"')
          security list-keychain -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -q "$SIGN_IDENTITY" \
            || { echo "imported keychain has no Developer ID cert" >&2; exit 1; }

      # Archive and export, the path Apple and Sparkle both document for a
      # Developer ID app: the export signs every nested binary with the
      # identity, a secure timestamp and no get-task-allow. `xcodebuild build`
      # signs for local debugging instead, and it never re-signs the helpers
      # inside Sparkle.framework, which ship ad-hoc signed.
      - name: Archive and export
        working-directory: app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          FEED_URL: ${{ inputs.feed_url }}
        run: |
          set -o pipefail
          # A tag push has no inputs, so a release always keeps the feed
          # project.yml declares; only a manual run can point a build elsewhere.
          feed=()
          if [[ -n "$FEED_URL" ]]; then feed=("SPARKLE_FEED_URL=$FEED_URL"); fi
          xcodebuild \
            -project Sissy.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/Sissy.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            ${feed[@]+"${feed[@]}"} \
            archive | xcbeautify --renderer github-actions
          xcodebuild -exportArchive \
            -archivePath build/Sissy.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Verify bundle version
        working-directory: app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          # The plists carry only $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION),
          # so a literal reintroduced into either one would silently ship a
          # bundle whose About window disagrees with the DMG, the cask and the
          # tag. Assert before notarization, which costs minutes.
          PLIST="$APP/Contents/Info.plist"
          for pair in "CFBundleShortVersionString:$VERSION" "CFBundleVersion:$BUILD"; do
            key="${pair%%:*}"
            want="${pair#*:}"
            got="$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST")"
            [[ "$got" == "$want" ]] \
              || { echo "$key is '$got', expected '$want'" >&2; exit 1; }
          done

      - name: Verify code signature
        working-directory: app
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Notarization preflight, on the app and on every binary nested in
          # it: signed by the Developer ID authority (a Mac Development cert
          # also carries the team id but cannot be notarized), with a secure
          # timestamp and the hardened runtime, and without get-task-allow. Asserting each one lets the
          # un-notarized dry run catch a helper the export left ad-hoc before a
          # tag triggers the real notary submission.
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          for code in "$APP" "$SPARKLE" "$SPARKLE/Versions/Current/Autoupdate" "$SPARKLE/Versions/Current/Updater.app"; do
            info="$(codesign -dvv "$code" 2>&1)"
            grep -q "Authority=$SIGN_IDENTITY" <<<"$info" \
              || { echo "$code not signed with '$SIGN_IDENTITY' authority" >&2; exit 1; }
            grep -q "Timestamp=" <<<"$info" \
              || { echo "no secure timestamp on $code" >&2; exit 1; }
            grep -q "flags=.*(runtime)" <<<"$info" \
              || { echo "no hardened runtime on $code" >&2; exit 1; }
            if codesign -d --entitlements - "$code" 2>/dev/null | grep -q "get-task-allow"; then
              echo "get-task-allow present on $code" >&2
              exit 1
            fi
          done
          # The app is not sandboxed, so Sparkle's XPC services are stripped
          # at archive time; one left behind is a nested binary nothing checks.
          [[ ! -e "$SPARKLE/Versions/Current/XPCServices" ]] \
            || { echo "Sparkle XPC services still bundled" >&2; exit 1; }

      # The cask copies Sissy.app out of the DMG, so a ticket stapled to the
      # DMG alone never reaches /Applications: the first launch then has to
      # look the ticket up online, and an offline or filtered Mac refuses it.
      # So the app is notarized and stapled on its own before the DMG is
      # built from it, and the DMG is still notarized below for a download
      # opened straight from Releases.
      - name: Notarize and staple the app
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/Sissy-notarize.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          rm -f "$ZIP"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Create DMG
        working-directory: app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          DMG="../dist/Sissy-$VERSION.dmg"
          create-dmg \
            --volname "Sissy $VERSION" \
            --window-pos 200 120 \
            --window-size 540 320 \
            --icon-size 96 \
            --icon "Sissy.app" 140 160 \
            --hide-extension "Sissy.app" \
            --app-drop-link 400 160 \
            --no-internet-enable \
            "$DMG" "$APP"

      - name: Notarize DMG
        if: ${{ inputs.dry_run != 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The app inside already carries its own stapled ticket; this one is
          # for the DMG itself, so a download opened straight from Releases
          # verifies offline too.
          DMG="dist/Sissy-$VERSION.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Generate checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          shasum -a 256 "Sissy-$VERSION.dmg" > "Sissy-$VERSION.dmg.sha256"
          cat "Sissy-$VERSION.dmg.sha256"

      - name: Upload artifacts (always, even on dry-run)
        uses: actions/upload-artifact@v7
        with:
          name: Sissy-${{ steps.version.outputs.version }}
          path: |
            dist/Sissy-*.dmg
            dist/Sissy-*.dmg.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A copy without the version, so releases/latest/download/Sissy.dmg
          # always resolves to the newest build; the website links to it.
          cp "dist/Sissy-$VERSION.dmg" dist/Sissy.dmg
          gh release create "v$VERSION" \
            "dist/Sissy-$VERSION.dmg" \
            "dist/Sissy-$VERSION.dmg.sha256" \
            dist/Sissy.dmg \
            --title "Sissy $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      # The update feed. Written only here, once the release it names exists,
      # into the website's public/, which Cloudflare deploys on the push. The
      # feed is signed, so nothing else may write it: an edit by hand, or by
      # the site's own build, invalidates it for every installed Sissy.
      - name: Check out the website
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SITE_REPO }}
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Publish the update feed
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          FEED="$RUNNER_TEMP/appcast"
          APPCAST="website/public/appcast.xml"
          GENERATE="app/build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
          mkdir -p "$FEED"
          # The live feed is the base, so every earlier item keeps the
          # signature it was published with; only this release is added. The
          # notes are the tag's annotation, the same text the GitHub Release
          # carries, and Sparkle renders them as markdown.
          if [[ -f "$APPCAST" ]]; then cp "$APPCAST" "$FEED/"; fi
          cp "dist/Sissy-$VERSION.dmg" "$FEED/"
          cp "$RUNNER_TEMP/release-notes.md" "$FEED/Sissy-$VERSION.md"
          # Each item names its own release's versioned DMG: the signature is
          # of one file, and latest/download is a different file after the
          # next tag.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$GENERATE" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --embed-release-notes \
            --link "$SITE_URL" \
            --maximum-deltas 0 \
            "$FEED"
          # generate_appcast omits signatures without an error when the app
          # declares no public key, and every installed Sissy would then
          # refuse the feed. Assert what a client verifies before publishing.
          items="$(grep -c '<item>' "$FEED/appcast.xml")"
          signed="$(grep -c 'sparkle:edSignature=' "$FEED/appcast.xml")"
          [[ "$items" -gt 0 && "$items" == "$signed" ]] \
            || { echo "appcast has $items items but $signed signatures" >&2; exit 1; }
          grep -q 'sparkle-signatures:' "$FEED/appcast.xml" \
            || { echo "appcast carries no feed signature" >&2; exit 1; }
          grep -q "<sparkle:version>$BUILD</sparkle:version>" "$FEED/appcast.xml" \
            || { echo "appcast has no item for build $BUILD" >&2; exit 1; }
          cp "$FEED/appcast.xml" "$APPCAST"
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/appcast.xml
          git commit -m "appcast: sissy $VERSION"
          git push

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sissy-signing.keychain-db" || true

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download DMG and compute SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "v${VERSION}" \
            --repo xsmyile/sissy \
            --pattern "Sissy-${VERSION}.dmg" \
            --dir assets
          SHA=$(sha256sum "assets/Sissy-${VERSION}.dmg" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v6
        with:
          repository: xsmyile/homebrew-sissy
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Regenerate Casks/sissy.rb
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p Casks
          rm -f Casks/.gitkeep
          # The `uninstall launchctl:` stanza and the LaunchAgents zap path
          # name an agent nothing registers any more. They stay because the
          # machines that need them are exactly the ones that never ran the
          # in-app retirement: a user who uninstalls before ever launching
          # the first release that carries LegacyAgentRetirement would
          # otherwise keep a login item starting a binary the DMG no longer
          # contains. 0.2.0 is the first release that carries it, so drop them
          # with the bundled plists a release after this one.
          cat > Casks/sissy.rb << 'CASK'
          cask "sissy" do
            version "__VERSION__"
            sha256 "__SHA256__"

            url "https://github.com/xsmyile/sissy/releases/download/v#{version}/Sissy-#{version}.dmg"
            name "Sissy"
            desc "Menu bar meter for Claude Code and Codex spend, rate limits and activity"
            homepage "https://github.com/xsmyile/sissy"

            depends_on macos: :tahoe
            # Sissy updates itself through Sparkle, so Homebrew leaves it to
            # the app unless asked with --greedy.
            auto_updates true

            app "Sissy.app"

            uninstall launchctl: "com.radonforge.sissy.server",
                      quit:      "com.radonforge.sissy"

            zap trash: [
              "~/Library/Application Support/Sissy",
              "~/Library/Preferences/com.radonforge.sissy.plist",
              "~/Library/Caches/com.radonforge.sissy",
              "~/Library/LaunchAgents/com.radonforge.sissy.server.plist",
            ]
          end
          CASK
          sed -i "s/__VERSION__/${VERSION}/g" Casks/sissy.rb
          sed -i "s/__SHA256__/${SHA256}/g" Casks/sissy.rb
          cat Casks/sissy.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sissy.rb
          if git diff --cached --quiet; then
            echo "no cask changes — already up to date"
            exit 0
          fi
          git commit -m "sissy ${VERSION}"
          git push
