name: pricing-drift

# Weekly (and on-demand) check that the hardcoded pricing tables still agree
# with LiteLLM for every model Sissy's readers can emit. Kept OUT of ci.yml on
# purpose: it hits the network and tracks LiteLLM `main`, so it must never gate
# an unrelated PR. A red run here means a provider shipped a new model or
# changed a rate — see the job log for ready-to-paste Swift rows.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pricing-drift:
    name: pricing tables vs LiteLLM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check pricing drift
        run: python3 scripts/check_pricing_drift.py --check
