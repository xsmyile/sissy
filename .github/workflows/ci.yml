name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (shellcheck + actionlint + doc refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck scripts/*.sh app/Sissy/Resources/*.sh
      - name: doc references
        run: python3 scripts/check-doc-refs.py
      - name: prose
        run: python3 scripts/check-prose.py
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "$tarball" actionlint
          ./actionlint -color

  # A PR that touches only prose needs no Mac. The list is explicit, so a file
  # nobody thought of still builds: THIRD-PARTY-NOTICES.md and CREDITS.md are
  # absent because the app ships them and AboutTests reads them.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PROSE: '^(docs/.*|AGENTS\.md|CODE_OF_CONDUCT\.md|CONTRIBUTING\.md|README\.md|SECURITY\.md|\.github/PULL_REQUEST_TEMPLATE\.md)$'
        run: |
          set -uo pipefail
          code=true
          if [ -n "$PR" ] && files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" \
            && [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$PROSE"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "builds on a Mac: $code"

  app:
    name: app + cli (${{ matrix.configuration }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      # Release is the configuration that ships: its own bundle id, and with it
      # the release paths and keychain namespace, and whole-module optimisation.
      # Debug alone never compiles the binary a user runs.
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: SwiftLint
        if: matrix.configuration == 'Debug'
        working-directory: ${{ github.workspace }}
        run: scripts/swiftlint.sh lint --quiet --strict --baseline .swiftlint-baseline

      - name: Swift format lint
        if: matrix.configuration == 'Debug'
        working-directory: ${{ github.workspace }}
        run: |
          xcrun swift-format lint --recursive --strict \
            app/Sissy app/SissyCore app/SissyTests

      - name: Build the CLI
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration "${{ matrix.configuration }}" build CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: CLI self-test
        run: |
          CLI="$(../scripts/cli-path.sh "${{ matrix.configuration }}")"
          "$CLI" --self-test

      - name: Codex parser smoke (--scan against fixture)
        if: matrix.configuration == 'Debug'
        timeout-minutes: 3
        run: |
          CLI="$(../scripts/cli-path.sh Debug)"
          ../scripts/codex-smoke.sh "$CLI"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme Sissy \
            -configuration "${{ matrix.configuration }}" build CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Unit tests
        if: matrix.configuration == 'Debug'
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme Sissy \
            -configuration Debug -destination 'platform=macOS' \
            test CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
