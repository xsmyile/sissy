name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (shellcheck + actionlint + doc refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck scripts/*.sh app/Sissy/Resources/*.sh
      - name: doc references
        run: python3 scripts/check-doc-refs.py
      - name: prose
        run: python3 scripts/check-prose.py
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "$tarball" actionlint
          ./actionlint -color

  app:
    name: app + cli (Xcode build + self-test)
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install build tools
        run: brew install xcodegen xcbeautify swiftlint

      - name: Generate project
        run: xcodegen generate

      - name: SwiftLint
        working-directory: ${{ github.workspace }}
        run: swiftlint lint --quiet --strict --baseline .swiftlint-baseline

      - name: Swift format lint
        working-directory: ${{ github.workspace }}
        run: |
          xcrun swift-format lint --recursive --strict \
            app/Sissy app/SissyCore app/SissyTests

      - name: Build the CLI
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: CLI self-test
        run: |
          "$(../scripts/cli-path.sh Debug)" --self-test

      # The configuration that ships: its own bundle id, and with it the
      # release paths and keychain namespace, and whole-module optimisation.
      # Debug alone never compiles the binary a user runs.
      - name: Build the CLI (Release)
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme sissy-cli \
            -configuration Release build CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: CLI self-test (Release)
        run: |
          "$(../scripts/cli-path.sh Release)" --self-test

      - name: Codex parser smoke (--scan against fixture)
        working-directory: app
        timeout-minutes: 3
        run: ../scripts/codex-smoke.sh "$(../scripts/cli-path.sh Debug)"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme Sissy \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build app (Release)
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme Sissy \
            -configuration Release build CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -project Sissy.xcodeproj -scheme Sissy \
            -configuration Debug -destination 'platform=macOS' \
            test CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
