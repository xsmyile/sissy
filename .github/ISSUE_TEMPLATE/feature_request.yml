name: Feature request
description: Something Sissy should do and does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth a grep of [`AGENTS.md`](https://github.com/xsmyile/sissy/blob/master/AGENTS.md)
        first. Several obvious-looking features were built, measured and removed,
        and it says why.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: >
        The question you want the app to answer, rather than the control you
        imagine answering it. Sissy is a meter: the useful ones are usually a
        reading, not a widget.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: The tab you open, the command you run, the number you work out by hand.

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Metering (a CLI, its tokens, its cost, its limits)
        - The panel or the menu bar
        - Settings, accounts, or the archive
        - Something else
