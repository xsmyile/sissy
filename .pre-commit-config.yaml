# Local hooks call tools already on PATH (matches CI exactly: no version drift).
# Install once per clone:  pre-commit install
# Run on full tree:        pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format
        entry: xcrun swift-format lint --recursive --strict
        language: system
        files: ^app/(Sissy|SissyCore|SissyTests)/.*\.swift$
        pass_filenames: false
        args: [app/Sissy, app/SissyCore, app/SissyTests]

      - id: swiftlint
        name: swiftlint
        entry: swiftlint lint --quiet --lenient
        language: system
        files: ^app/(Sissy|SissyCore)/.*\.swift$
        pass_filenames: false

      - id: doc-refs
        name: doc-refs
        entry: python3 scripts/check-doc-refs.py
        language: system
        files: ^(app/(Sissy|SissyCore|SissyTests)/.*\.swift|scripts/check-doc-refs\.py|\.docref-baseline)$
        pass_filenames: false

      - id: prose
        name: prose
        entry: python3 scripts/check-prose.py
        language: system
        files: ^(README|SECURITY|CONTRIBUTING|CREDITS|CODE_OF_CONDUCT)\.md$|^NOTICE$|^app/(Sissy|SissyCore|SissyTests)/.*\.swift$|^scripts/check-prose\.py$
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^(scripts/|app/Sissy/Resources/).*\.sh$

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
