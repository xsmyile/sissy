# Local hooks call tools already on PATH (matches CI exactly: no version drift).
# Install once per clone:  pre-commit install
# Run on full tree:        pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format
        entry: xcrun swift-format lint --recursive --strict
        language: system
        files: ^app/(Sissy|SissyCore|SissyTests)/.*\.swift$
        pass_filenames: false
        args: [app/Sissy, app/SissyCore, app/SissyTests]

      - id: swiftlint
        name: swiftlint
        entry: swiftlint lint --quiet --lenient
        language: system
        files: ^app/(Sissy|SissyCore)/.*\.swift$
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^scripts/.*\.sh$

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
