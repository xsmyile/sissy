name: Sissy
options:
  bundleIdPrefix: com.radonforge
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: AS75YRKL95
    # Swift 6 with complete strict concurrency. Project targets macOS 26+
    # so there's no toolchain reason to stay on Swift 5; making the
    # Sendable / isolation checks errors at compile time is what catches
    # the data races that a runtime smoke test would miss.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Dev placeholders. The git tag is the source of truth: every release
    # path resolves both from `scripts/version.sh` and passes them on the
    # xcodebuild command line, which reaches both targets. A bundle
    # reporting 0.0.0 (0) is therefore a local build, by construction.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"

targets:
  Sissy:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sissy
      # The metering engine the app runs in-process. Still shared with the
      # command-line tool, which CI drives for --self-test / --scan /
      # --dump-seed / --refresh-catalog. Excluded here is the tool's own
      # entry point and self-test harness, plus the path helper the app
      # carries its own copy of. See docs/single-process-migration.md.
      - path: SissyServer
        excludes:
          - main.swift
          - SelfTest.swift
          - SissyPaths.swift
      # Still bundled, and only so the one-shot retirement can undo them:
      # `SMAppService.agent(plistName:)` resolves the plist inside the app
      # bundle, so an agent whose plist is gone cannot be unregistered — it
      # just keeps starting at login, forever, running a binary the app no
      # longer ships. Measured: with these removed, `.status` answers
      # "Unable to find service status" and the retirement is a no-op on
      # exactly the machines that need it. Delete them a release after
      # 0.1.10, once installs have rolled through.
      - path: ServiceManagement/com.radonforge.sissy.server.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: ServiceManagement/com.radonforge.sissy.server.dev.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies: []
    info:
      path: Sissy/Info.plist
      properties:
        CFBundleDisplayName: Sissy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Smyile. MIT licensed."
    entitlements:
      path: Sissy/Sissy.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radonforge.sissy
        PRODUCT_NAME: Sissy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        # `.dev` bundle id on Debug so a release Sissy.app and a locally
        # built dev Sissy.app can coexist — different LaunchAgent label,
        # different Application Support subdir, different default port.
        # Release keeps the canonical bundle id so existing installs
        # upgrade cleanly.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.radonforge.sissy.dev

  SissyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - SissyTests
    dependencies:
      - target: Sissy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radonforge.sissy.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sissy.app/Contents/MacOS/Sissy"

  # Not shipped to anyone. CI drives it for --self-test / --scan /
  # --dump-seed / --refresh-catalog, which is why it exists at all: the
  # engine's checks need an entry point that is not an AppKit app.
  sissy-cli:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - SissyServer
    settings:
      base:
        # Deliberately not `…sissy.server`: that string is now the label of
        # the retired LaunchAgent, which `LegacyAgentRetirement` still looks
        # up and the cask still zaps. Two things answering to one id is how a
        # retirement ends up pointed at the wrong one.
        PRODUCT_BUNDLE_IDENTIFIER: com.radonforge.sissy.cli
        PRODUCT_NAME: sissy-cli
        INFOPLIST_FILE: SissyServer/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        # Mirror the app target so a Debug build reads what a dev `Sissy.app`
        # wrote. The tool reads `Bundle.main.bundleIdentifier` from the
        # embedded `__info_plist` section and uses the `.dev` suffix to pick
        # the `Sissy-Dev/` support dir.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.radonforge.sissy.cli.dev
