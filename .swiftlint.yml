# `app/SissyTests` is deliberately absent: it was listed here and in
# `excluded` at the same time, and `excluded` wins — the tests have never been
# linted. `swift-format` covers them, which is what the pre-commit hook and CI
# both run against them.
included:
  - app/Sissy
  - app/SissyCore

disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - identifier_name
  - todo
  - file_length
  - type_body_length
  - function_body_length
  - implicit_optional_initialization

excluded:
  - app/SissyTests

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - reduce_into
  - sorted_first_last
  - toggle_bool
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_string_enum_value
  - redundant_void_return
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

force_unwrapping:
  severity: warning
force_cast:
  severity: warning
force_try:
  severity: warning
implicitly_unwrapped_optional:
  severity: warning

reporter: "github-actions-logging"
