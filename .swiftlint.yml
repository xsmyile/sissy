included:
  - app/Sissy
  - app/SissyServer
  - app/SissyTests

disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - identifier_name
  - todo
  - file_length
  - type_body_length
  - function_body_length
  - implicit_optional_initialization
  # Codebase intentionally uses non-failable lossy String(decoding:as:) for
  # WS frames, serial replies, and hostname/IP display where U+FFFD is fine;
  # the failable conversion this rule prefers would drop whole payloads on a
  # single invalid byte.
  - optional_data_string_conversion

excluded:
  - app/SissyTests

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - reduce_into
  - sorted_first_last
  - toggle_bool
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_string_enum_value
  - redundant_void_return
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

force_unwrapping:
  severity: warning
force_cast:
  severity: warning
force_try:
  severity: warning
implicitly_unwrapped_optional:
  severity: warning

reporter: "github-actions-logging"
